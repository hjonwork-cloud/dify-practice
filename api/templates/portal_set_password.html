<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>비밀번호 설정 | 세일즈 액션 플랫폼</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
  <link href="/static/admin.css?v={{ asset_v }}" rel="stylesheet">
  <style>
    .pw-card{max-width:420px;margin:4rem auto;padding:2rem;background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08);}
    .pw-card h2{margin:0 0 .5rem;font-size:1.25rem;}
    .pw-card p{font-size:.87rem;color:#6b7280;margin:.25rem 0 1.2rem;}
    .pw-card label{display:block;font-size:.85rem;font-weight:600;margin-bottom:.75rem;}
    .pw-card label input{display:block;width:100%;margin-top:.25rem;padding:.55rem .75rem;border:1px solid #d1d5db;border-radius:8px;font-size:.9rem;box-sizing:border-box;}
    .pw-card label input:focus{outline:2px solid #16a34a;border-color:transparent;}
    .alert.error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:8px;padding:.6rem .85rem;font-size:.85rem;margin-bottom:1rem;}
    .btn-submit{width:100%;padding:.7rem;background:#16a34a;color:#fff;border:none;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer;margin-top:.25rem;}
    .btn-submit:hover{background:#15803d;}
  </style>
</head>
<body style="background:#f8fafc;font-family:'Pretendard Variable',sans-serif;">
  <div class="pw-card">
    <h2>🔒 비밀번호 설정</h2>
    {% if must_change %}
    <p>관리자에 의해 비밀번호가 초기화되었습니다. 새 비밀번호를 설정해주세요.</p>
    {% else %}
    <p>처음 로그인하셨습니다. 사용할 비밀번호를 설정해주세요. (6자 이상)</p>
    {% endif %}
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    <form method="post" action="/portal/set-password">
      <label>새 비밀번호
        <input type="password" name="password" autocomplete="new-password" placeholder="6자 이상" required autofocus>
      </label>
      <label>비밀번호 확인
        <input type="password" name="password2" autocomplete="new-password" placeholder="다시 입력" required>
      </label>
      <button type="submit" class="btn-submit">비밀번호 설정 완료</button>
    </form>
  </div>
</body>
</html>
