{% extends "portal_base.html" %}
{% block title %}외부 가격/GP 조회{% endblock %}

{% block content %}
<style>
.gpl-wrap{max-width:1180px;margin:0 auto;}
.gpl-head{margin-bottom:1.1rem;}
.gpl-head h2{font-size:1.3rem;font-weight:800;color:#0f172a;margin:0 0 .25rem;}
.gpl-head p{color:#64748b;font-size:.86rem;margin:0;}
.gpl-search{background:#fff;border-radius:12px;padding:1rem 1.2rem;box-shadow:0 1px 4px rgba(0,0,0,.07);display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem;}
.gpl-search input[type=text]{flex:1;min-width:220px;border:1.5px solid #cbd5e1;border-radius:8px;padding:.55rem .8rem;font-size:.88rem;outline:none;}
.gpl-search input[type=text]:focus{border-color:#1677ff;}
.gpl-search select{border:1.5px solid #cbd5e1;border-radius:8px;padding:.55rem .7rem;font-size:.85rem;background:#fff;}
.gpl-search button{background:#1677ff;color:#fff;border:none;border-radius:8px;padding:.55rem 1.3rem;font-weight:700;font-size:.86rem;cursor:pointer;}
.gpl-search button:hover{opacity:.88;}
.gpl-results{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:1rem;overflow:hidden;display:none;}
.gpl-results table{width:100%;border-collapse:collapse;font-size:.83rem;}
.gpl-results th{background:#f8fafc;padding:.55rem .8rem;text-align:left;font-weight:700;color:#64748b;font-size:.72rem;text-transform:uppercase;white-space:nowrap;}
.gpl-results td{padding:.55rem .8rem;border-top:1px solid #f1f5f9;}
.gpl-results tr.rowbtn{cursor:pointer;}
.gpl-results tr.rowbtn:hover td{background:#f0f7ff;}
.gpl-empty,.gpl-loading{text-align:center;padding:2.5rem;color:#94a3b8;font-size:.88rem;}
.gpl-detail{display:none;}
.gpl-kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-bottom:.9rem;}
@media(max-width:760px){.gpl-kpi-row{grid-template-columns:1fr;}}
.gpl-kpi{background:#fff;border-radius:12px;padding:1rem 1.2rem;box-shadow:0 1px 4px rgba(0,0,0,.07);}
.gpl-kpi .l{font-size:.7rem;color:#94a3b8;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.gpl-kpi .v{font-size:1.4rem;font-weight:900;margin-top:.2rem;color:#0f172a;}
.market-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-bottom:1rem;}
@media(max-width:760px){.market-grid{grid-template-columns:1fr;}}
.market-card{background:#fff;border-radius:12px;padding:1rem 1.2rem;box-shadow:0 1px 4px rgba(0,0,0,.07);border-top:3px solid transparent;}
.market-card.c-min{border-color:#3b82f6;} .market-card.c-avg{border-color:#10b981;} .market-card.c-max{border-color:#ef4444;}
.mc-label{font-size:.7rem;color:#94a3b8;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.mc-val{font-size:1.4rem;font-weight:900;margin-top:.2rem;}
.mc-sub{font-size:.76rem;color:#64748b;margin-top:.25rem;}
.gp-alert{color:#b91c1c;font-weight:700;} .gp-warn{color:#92400e;font-weight:700;} .gp-ok{color:#15803d;font-weight:700;}
.chart-card{background:#fff;border-radius:12px;padding:1.2rem 1.4rem;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:1rem;}
.chart-card h4{font-size:.9rem;font-weight:700;color:#1e293b;margin:0 0 .7rem;}
.chart-wrap{position:relative;height:300px;}
.seller-card{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.07);overflow:hidden;}
.seller-card .head{padding:.9rem 1.2rem;font-weight:700;font-size:.9rem;border-bottom:1px solid #f1f5f9;}
.seller-table{width:100%;border-collapse:collapse;font-size:.82rem;}
.seller-table th{background:#f8fafc;padding:.5rem .8rem;text-align:left;font-weight:700;color:#64748b;font-size:.7rem;text-transform:uppercase;white-space:nowrap;}
.seller-table td{padding:.5rem .8rem;border-top:1px solid #f8fafc;}
.badge{display:inline-block;padding:.15rem .5rem;border-radius:99px;font-size:.72rem;font-weight:700;}
.badge-baemin{background:#fff0e8;color:#d4380d;} .badge-foodspring{background:#e6f4ff;color:#0958d9;}
.back-link{display:inline-flex;align-items:center;gap:.3rem;color:#1677ff;font-weight:700;font-size:.85rem;text-decoration:none;margin-bottom:.8rem;cursor:pointer;}
.gpl-head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
.gpl-ext-btn{background:#fff;border:1.5px solid #1677ff;color:#1677ff;border-radius:8px;padding:.55rem 1.1rem;font-weight:700;font-size:.85rem;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.gpl-ext-btn:hover{background:#eff6ff;}
</style>

<div class="gpl-wrap">
  <div class="gpl-head-row">
    <div class="gpl-head">
      <h2>📈 외부 가격/GP 조회</h2>
      <p>외부상품과 매핑된 우리 상품코드만 조회가 가능합니다. 외부상품을 직접 검색하시려면 우측의 <b>외부상품 조회하기</b>를 눌러주세요.</p>
    </div>
    <button type="button" class="gpl-ext-btn" onclick="openExtSearch()">🔍 외부상품 조회하기</button>
  </div>

  <div class="gpl-search">
    <input type="text" id="gplKeyword" placeholder="상품코드 또는 상품명 입력 (예: 동원참치, 100123)" onkeydown="if(event.key==='Enter') gplSearch()">
    <select id="gplPlant">
      {% for p in plants %}
      <option value="{{ p }}" {% if p==plant %}selected{% endif %}>{{ PLANT_LABELS[p] }}</option>
      {% endfor %}
    </select>
    <button onclick="gplSearch()">검색</button>
  </div>

  <div class="gpl-results" id="gplResults">
    <table>
      <thead><tr><th>상품코드</th><th>상품명</th><th>대분류</th><th>전월 매출액</th><th>전월 매출수량</th></tr></thead>
      <tbody id="gplResultsBody"></tbody>
    </table>
  </div>
  <div class="gpl-loading" id="gplLoading" style="display:none;">검색 중...</div>
  <div class="gpl-empty" id="gplEmpty" style="display:none;">검색 결과가 없습니다.</div>
</div>

<!-- 외부상품 조회 팝업 (단순 조회 전용 — 매핑/선택 기능 없음) -->
<div id="ext-search-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;padding:1.5rem;width:min(760px,96vw);max-height:88vh;display:flex;flex-direction:column;gap:1rem;box-shadow:0 20px 60px rgba(0,0,0,.25);">
    <div style="display:flex;align-items:center;gap:.75rem;">
      <div style="font-weight:700;font-size:1rem;">🔍 외부상품 조회</div>
      <button onclick="closeExtSearch()" style="margin-left:auto;background:none;border:none;font-size:1.4rem;cursor:pointer;color:#94a3b8;">✕</button>
    </div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
      <input type="text" id="ext-keyword" placeholder="*김치* 형태 와일드카드 검색 가능"
             style="flex:1;min-width:220px;border:1.5px solid #cbd5e1;border-radius:8px;padding:.55rem .8rem;font-size:.88rem;outline:none;"
             onkeydown="if(event.key==='Enter') searchExt()">
      <button onclick="searchExt()" style="background:#1677ff;color:#fff;border:none;border-radius:8px;padding:.55rem 1.3rem;font-weight:700;font-size:.86rem;cursor:pointer;">검색</button>
    </div>
    <div id="ext-toolbar" style="display:none;align-items:center;gap:.5rem;flex-wrap:wrap;">
      <label style="font-size:.8rem;color:#64748b;font-weight:600;">플랫폼</label>
      <select id="ext-platform-filter" onchange="onExtPlatformChange()"
              style="border:1.5px solid #cbd5e1;border-radius:8px;padding:.4rem .6rem;font-size:.82rem;background:#fff;min-width:120px;">
        <option value="">전체 플랫폼</option>
        <option value="baemin">배민상회</option>
        <option value="foodspring">식봄</option>
      </select>
      <label style="font-size:.8rem;color:#64748b;font-weight:600;">셀러</label>
      <select id="ext-seller-filter" onchange="renderExtTable()"
              style="border:1.5px solid #cbd5e1;border-radius:8px;padding:.4rem .6rem;font-size:.82rem;background:#fff;min-width:140px;">
        <option value="">전체 셀러</option>
      </select>
      <div style="display:flex;border:1.5px solid #cbd5e1;border-radius:8px;overflow:hidden;">
        <button type="button" id="ext-vat-exclude" onclick="setExtVatMode('exclude')"
                style="border:none;padding:.4rem .7rem;font-size:.78rem;font-weight:700;cursor:pointer;">VAT 제외</button>
        <button type="button" id="ext-vat-include" onclick="setExtVatMode('include')"
                style="border:none;padding:.4rem .7rem;font-size:.78rem;font-weight:700;cursor:pointer;border-left:1.5px solid #cbd5e1;">VAT 포함</button>
      </div>
      <span style="margin-left:auto;font-size:.76rem;color:#94a3b8;">실판매가 헤더를 클릭하면 정렬됩니다</span>
    </div>
    <div id="ext-results" style="overflow-y:auto;flex:1;border:1px solid #e2e8f0;border-radius:8px;min-height:260px;max-height:420px;">
      <div style="padding:2rem;text-align:center;color:#94a3b8;font-size:.88rem;">검색어를 입력하세요 (예: *김치*)</div>
    </div>
  </div>
</div>

<script>
async function gplSearch(){
  const kw = document.getElementById('gplKeyword').value.trim();
  const plant = document.getElementById('gplPlant').value;
  document.getElementById('gplResults').style.display='none';
  document.getElementById('gplEmpty').style.display='none';
  document.getElementById('gplLoading').style.display='block';
  try{
    const res = await fetch(`/portal/price-monitor/api/gp-lookup/search?keyword=${encodeURIComponent(kw)}&plant=${plant}`);
    const data = await res.json();
    document.getElementById('gplLoading').style.display='none';
    if(!data.items || data.items.length===0){
      document.getElementById('gplEmpty').style.display='block';
      return;
    }
    const body = document.getElementById('gplResultsBody');
    body.innerHTML = data.items.map(it => `
      <tr class="rowbtn" onclick="location.href='/portal/price-monitor/detail/${it.product_code}?plant=${plant}'">
        <td>${it.product_code}</td>
        <td>${it.product_name||''}</td>
        <td>${it.category||'-'}</td>
        <td>${it.prev_sales_amt ? Math.round(it.prev_sales_amt).toLocaleString()+'원' : '-'}</td>
        <td>${it.prev_sales_qty ? Math.round(it.prev_sales_qty).toLocaleString() : '-'}</td>
      </tr>`).join('');
    document.getElementById('gplResults').style.display='block';
  }catch(e){
    document.getElementById('gplLoading').style.display='none';
    document.getElementById('gplEmpty').style.display='block';
  }
}

// ── 외부상품 조회 팝업 (단순 조회 전용) ──────────────────────────────────
let extRows = [];
let extSortDir = null; // null(기본) | 'asc' | 'desc' — 실판매가 기준
let extVatMode = 'exclude'; // 'exclude'(기본) | 'include' — 플랫폼 판매가가 VAT포함값이라가정하고 제외시 1.1로 나눈

function setExtVatMode(mode){
  extVatMode = mode;
  const exBtn = document.getElementById('ext-vat-exclude');
  const inBtn = document.getElementById('ext-vat-include');
  const activeStyle = 'background:#1677ff;color:#fff;';
  const inactiveStyle = 'background:#fff;color:#475569;';
  exBtn.setAttribute('style', exBtn.getAttribute('style').replace(/background:[^;]+;color:[^;]+;/,'') + (mode==='exclude'?activeStyle:inactiveStyle));
  inBtn.setAttribute('style', inBtn.getAttribute('style').replace(/background:[^;]+;color:[^;]+;/,'') + (mode==='include'?activeStyle:inactiveStyle));
  renderExtTable();
}

function openExtSearch(){
  document.getElementById('ext-keyword').value = '';
  extRows = [];
  extSortDir = null;
  document.getElementById('ext-toolbar').style.display = 'none';
  document.getElementById('ext-results').innerHTML = '<div style="padding:2rem;text-align:center;color:#94a3b8;font-size:.88rem;">검색어를 입력하세요 (예: *김치*)</div>';
  document.getElementById('ext-search-modal').style.display = 'flex';
  setTimeout(() => document.getElementById('ext-keyword').focus(), 30);
}
function closeExtSearch(){
  document.getElementById('ext-search-modal').style.display = 'none';
}

function populateExtSellerFilter(){
  const sel = document.getElementById('ext-seller-filter');
  const prev = sel.value;
  const platformFilter = document.getElementById('ext-platform-filter').value;
  const base = platformFilter ? extRows.filter(r => r.platform === platformFilter) : extRows;
  const sellers = Array.from(new Set(base.map(r => r.seller_name).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'ko'));
  sel.innerHTML = '<option value="">전체 셀러</option>' + sellers.map(s => `<option value="${s}">${s}</option>`).join('');
  if(sellers.includes(prev)) sel.value = prev; else sel.value = '';
}

function onExtPlatformChange(){
  populateExtSellerFilter();
  renderExtTable();
}

function toggleExtSort(){
  if(extSortDir === 'desc') extSortDir = 'asc';
  else if(extSortDir === 'asc') extSortDir = null;
  else extSortDir = 'desc';
  renderExtTable();
}

function renderExtTable(){
  const el = document.getElementById('ext-results');
  if(!extRows.length){
    el.innerHTML = '<div style="padding:2rem;text-align:center;color:#94a3b8;">결과 없음 — 다른 키워드를 시도해보세요</div>';
    return;
  }
  const platformFilter = document.getElementById('ext-platform-filter').value;
  const sellerFilter = document.getElementById('ext-seller-filter').value;
  let rows = extRows.slice();
  if(platformFilter) rows = rows.filter(r => r.platform === platformFilter);
  if(sellerFilter) rows = rows.filter(r => r.seller_name === sellerFilter);

  if(extSortDir){
    rows.sort((a,b) => {
      const av = a.net_price ?? -Infinity, bv = b.net_price ?? -Infinity;
      return extSortDir === 'asc' ? av - bv : bv - av;
    });
  }

  if(!rows.length){
    el.innerHTML = '<div style="padding:2rem;text-align:center;color:#94a3b8;">선택한 조건의 결과가 없습니다.</div>';
    return;
  }

  const arrow = extSortDir === 'asc' ? ' ▲' : (extSortDir === 'desc' ? ' ▼' : '');
  const vatDiv = extVatMode === 'exclude' ? 1.1 : 1;
  const vatSuffix = extVatMode === 'exclude' ? ' (VAT제외)' : ' (VAT포함)';
  const esc = v => (v||'').replace(/"/g,'&quot;');
  let html = `<table style="width:100%;border-collapse:collapse;font-size:.82rem;">
    <thead><tr style="background:#f8fafc;border-bottom:1px solid #e2e8f0;position:sticky;top:0;">
      <th style="padding:.4rem .5rem;">플랫폼</th>
      <th style="padding:.4rem .5rem;text-align:left;">상품명</th>
      <th style="padding:.4rem .5rem;text-align:right;">판매가${vatSuffix}</th>
      <th style="padding:.4rem .5rem;text-align:right;cursor:pointer;user-select:none;color:${extSortDir?'#1677ff':'inherit'};" onclick="toggleExtSort()" title="클릭하여 실판매가 정렬">실판매가${vatSuffix}${arrow}</th>
      <th style="padding:.4rem .5rem;text-align:left;">셀러</th>
    </tr></thead><tbody>`;
  rows.forEach(r => {
    const pfl = r.platform === 'baemin'
      ? '<span class="badge badge-baemin" style="font-size:.72rem;">배민상회</span>'
      : '<span class="badge badge-foodspring" style="font-size:.72rem;">식봄</span>';
    const price = r.price_sale ? Math.round(r.price_sale/vatDiv).toLocaleString()+'원' : '-';
    const net   = r.net_price ? Math.round(r.net_price/vatDiv).toLocaleString()+'원' : '-';
    html += `<tr style="border-bottom:1px solid #f1f5f9;">
      <td style="padding:.3rem .5rem;">${pfl}</td>
      <td style="padding:.3rem .5rem;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${esc(r.product_name)}">${r.product_name||'-'}</td>
      <td style="padding:.3rem .5rem;text-align:right;font-weight:600;">${price}</td>
      <td style="padding:.3rem .5rem;text-align:right;">${net}</td>
      <td style="padding:.3rem .5rem;color:#64748b;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${r.seller_name||'-'}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  el.innerHTML = html;
}

async function searchExt(){
  const kw = document.getElementById('ext-keyword').value.trim();
  const el = document.getElementById('ext-results');
  document.getElementById('ext-toolbar').style.display = 'none';
  if(!kw){
    el.innerHTML = '<div style="padding:2rem;text-align:center;color:#94a3b8;font-size:.88rem;">검색어를 입력하세요 (예: *김치*)</div>';
    return;
  }
  el.innerHTML = '<div style="padding:2rem;text-align:center;color:#94a3b8;">검색 중...</div>';
  try{
    const resp = await fetch(`/portal/price-monitor/api/gp-lookup/platform-search?keyword=${encodeURIComponent(kw)}`);
    const json = await resp.json();
    extRows = json.items || [];
    extSortDir = null;
    document.getElementById('ext-platform-filter').value = '';
    if(!extRows.length){
      el.innerHTML = '<div style="padding:2rem;text-align:center;color:#94a3b8;">결과 없음 — 다른 키워드를 시도해보세요</div>';
      return;
    }
    populateExtSellerFilter();
    document.getElementById('ext-toolbar').style.display = 'flex';
    setExtVatMode(extVatMode);
  }catch(e){
    el.innerHTML = '<div style="padding:2rem;text-align:center;color:#ef4444;">조회 중 오류가 발생했습니다.</div>';
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeExtSearch(); });

// 페이지 진입 시 기본 목록(매핑된 우리 상품) 자동 표시
document.addEventListener('DOMContentLoaded', () => { gplSearch(); setExtVatMode('exclude'); });
</script>
{% endblock %}
