{% extends "bt_layout.html" %}
{% block bt_content %}
<div class="kpis" id="kpis"><div class="bt-loading">불러오는 중…</div></div>

<div style="display:grid;grid-template-columns:1.2fr 1fr;gap:1rem;">
  <div class="pm-card">
    <div class="pm-card-head"><span class="pm-card-title">플랫폼별 매핑률 · 승·무·패 (운영 SKU 기준, 최강 경쟁자 1곳)</span></div>
    <table class="pm-table" id="pfTbl"></table>
  </div>
  <div class="pm-card">
    <div class="pm-card-head"><span class="pm-card-title">오늘의 할 일</span></div>
    <div id="todo" class="bt-loading">…</div>
  </div>
</div>

<div class="pm-card">
  <div class="pm-card-head"><span class="pm-card-title">🔴 패배 위험 TOP 15 (예상 일매출 기준, 배민·오늘얼마)</span>
    <a class="pm-btn pm-btn-ghost pm-btn-sm" href="{{ '/portal/price-monitor/bt/profit' }}">수익성·추천가 →</a></div>
  <div class="scroll-x"><table class="pm-table" id="riskTbl"></table></div>
</div>
{% endblock %}

{% block bt_scripts %}
<script>
(async()=>{
  try{
    const j=await btGet('/api/home'); renderMeta(j);
    const sc=j.status_counts||{}; const ev=j.events_today||{};
    const k=(l,v,s,c='')=>`<div class="kpi ${c}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s||''}</div></div>`;
    document.getElementById('kpis').innerHTML=
      k('운영 SKU (확정)', (j.active_cnt||0).toLocaleString(), `막힘 ${sc.blocked||0} · 수기제외 ${sc.excluded||0} · 5140 ${sc.group5140||0}`,'green')+
      k('예상 일수량 (전체센터)', num(j.demand_total,0), `일 예상매출 ${man(j.revenue_daily)}원 (평균 판매단가)`)+
      k('평균 GP (평균 판매단가)', j.gp_avg===null?'-':j.gp_avg+'%', `매출가중 ${j.gp_wavg??'-'}% · 경보 ${j.gp_alert_cnt} SKU`, j.gp_avg!==null&&j.gp_avg<BT_PARAMS.gp_alert?'red':'')+
      k('오늘 수발주 변동', ev.total||0, `막힘 ${ev.block||0} · 열림 ${ev.open||0} · 신규 ${ev.new||0}`, ev.red?'red':'')+
      k('미확인 이벤트', ev.unacked||0, `🔴 ${ev.red||0}건`, ev.unacked?'amber':'')+
      k('미매핑 운영 SKU', (j.unmapped_active||0).toLocaleString(), '3개 플랫폼 모두 매핑 없음', j.unmapped_active?'amber':'');
    const rows=['baemin','todaysales','foodspring'].map(pf=>{
      const m=j.map_rate[pf]||{}, w=j.wtl[pf]||{};
      const judged=(w.win||0)+(w.tie||0)+(w.lose||0);
      return `<tr><td>${pfBadge(pf)}</td><td class="num">${m.mapped||0}</td><td class="num"><b>${m.rate??0}%</b></td>
        <td class="num" style="color:#15803d">${w.win||0}</td><td class="num" style="color:#4338ca">${w.tie||0}</td>
        <td class="num" style="color:#b91c1c">${w.lose||0}</td><td class="num">${judged?Math.round((w.win||0)/judged*100)+'%':'-'}</td></tr>`;}).join('');
    document.getElementById('pfTbl').innerHTML=`<thead><tr><th>플랫폼</th><th class="num">매핑 SKU</th><th class="num">매핑률</th><th class="num">승</th><th class="num">무</th><th class="num">패</th><th class="num">승률</th></tr></thead><tbody>${rows}</tbody>`;
    const lr=j.last_run;
    const todo=[];
    if(ev.unacked) todo.push(`<li>미확인 수발주 이벤트 <b>${ev.unacked}</b>건 → <a href="${BT}/monitor">변동 모니터</a></li>`);
    if((j.due_releases||[]).length) todo.push(`<li>해제 예정일 도래 수기 제외 <b>${j.due_releases.length}</b>건 → <a href="${BT}/exclusions">수기 제외</a></li>`);
    if(j.unmapped_active) todo.push(`<li>미매핑 운영 SKU <b>${j.unmapped_active}</b>건 → <a href="${BT}/ai-queue">AI 추천 큐</a></li>`);
    if(j.gp_alert_cnt) todo.push(`<li>GP ${BT_PARAMS.gp_alert}% 미만 SKU <b>${j.gp_alert_cnt}</b>건 → <a href="${BT}/profit">수익성</a></li>`);
    todo.push(`<li class="muted">최근 스냅샷: ${lr?esc(lr.started_at)+' · '+esc(lr.status)+' · '+esc(lr.message||''):'아직 없음'}</li>`);
    document.getElementById('todo').outerHTML=`<ul style="font-size:.84rem;line-height:1.9;padding-left:1.1rem;">${todo.join('')}</ul>`;
    document.getElementById('riskTbl').innerHTML=`<thead><tr><th>SKU</th><th>플랫폼·셀러</th><th class="num">평균 판매단가<div class="muted">VAT 제외</div></th><th class="num">경쟁 실수취가</th><th class="num">차이</th><th class="num">예상 일수량</th><th class="num">일 매출</th></tr></thead><tbody>`+
      (j.risks||[]).map(r=>`<tr><td><span class="code">${esc(r.product_code)}</span> ${esc(r.product_name)}</td><td>${pfBadge(r.platform)} ${esc(r.seller)}</td>
        <td class="num">${won(r.our_price)}</td><td class="num">${won(r.comp_net)}</td><td class="num gp-alert">${pct(r.diff_pct)}</td>
        <td class="num">${num(r.demand_daily,1)}</td><td class="num">${won(r.stake)}</td></tr>`).join('')+
      (j.risks&&j.risks.length?'':'<tr><td colspan="7" class="muted">패배 SKU 없음</td></tr>')+'</tbody>';
  }catch(e){document.getElementById('kpis').innerHTML=`<div class="bt-loading" style="color:#b91c1c">⚠ ${esc(e.message)}</div>`;}
})();
</script>
{% endblock %}
